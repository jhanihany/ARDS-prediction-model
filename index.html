<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f4f1e7" />
  <title>ARDS Prediction Model</title>
  <meta name="description" content="Health Systems Engineering - ARDS Prediction Model presentation" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-kicker">Health Systems Engineering</span>
      <strong>ARDS Prediction Model</strong>
    </div>
    <div class="top-actions">
      <a class="icon-btn text-btn" href="assets/ARDS_Prediction_Model.pptx" download aria-label="PPT 원본 다운로드">PPT 원본</a>
      <button class="icon-btn" id="thumbToggle" type="button" aria-label="슬라이드 목록" title="슬라이드 목록">
        <span aria-hidden="true">☷</span>
      </button>
      <button class="icon-btn" id="fullscreenBtn" type="button" aria-label="전체 화면" title="전체 화면">
        <span aria-hidden="true">⛶</span>
      </button>
    </div>
  </header>

  <main class="app-shell">
    <section class="stage-wrap" aria-label="프레젠테이션 슬라이드">
      <button class="nav-btn nav-prev" id="prevBtn" type="button" aria-label="이전 슬라이드">‹</button>

      <div class="stage" id="stage">
        <img id="slideImage" alt="프레젠테이션 슬라이드" draggable="false" />
        <div class="loading" id="loading" aria-hidden="true">Loading…</div>
      </div>

      <button class="nav-btn nav-next" id="nextBtn" type="button" aria-label="다음 슬라이드">›</button>
    </section>

    <section class="controlbar" aria-label="프레젠테이션 컨트롤">
      <div class="progress-track" aria-hidden="true"><div class="progress-fill" id="progressFill"></div></div>
      <div class="controls-row">
        <button class="small-btn" id="prevSmall" type="button">이전</button>
        <div class="counter"><span id="currentSlide">1</span><span class="slash">/</span><span id="totalSlides">37</span></div>
        <button class="small-btn" id="nextSmall" type="button">다음</button>
      </div>
      <p class="hint">키보드 ← → · 화면 스와이프 · 슬라이드 클릭 시 다음 페이지</p>
    </section>
  </main>

  <aside class="thumb-panel" id="thumbPanel" aria-label="슬라이드 목록" aria-hidden="true">
    <div class="thumb-head">
      <strong>슬라이드</strong>
      <button class="icon-btn" id="thumbClose" type="button" aria-label="목록 닫기">×</button>
    </div>
    <div class="thumb-grid" id="thumbGrid"></div>
  </aside>
  <div class="backdrop" id="backdrop" hidden></div>

  <script src="script.js"></script>
</body>
</html>
